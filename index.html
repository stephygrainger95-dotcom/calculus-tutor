<script>


/* ==================================
   INTRO -> SYSTEM
================================== */


const intro =
document.getElementById("intro");


const app =
document.getElementById("app");



let entered=false;



function enterSystem(){


if(entered)
return;



entered=true;



intro.classList.add("hide");



setTimeout(()=>{


app.classList.add("show");


},800);



}





// 自动进入

setTimeout(
enterSystem,
5200
);



// 跳过按钮

document
.getElementById("skip")
.onclick=
enterSystem;







/* ==================================
   SPACE PARTICLES
================================== */


const canvas =
document.getElementById("space");


const ctx =
canvas.getContext("2d");



let stars=[];



function resize(){


canvas.width =
window.innerWidth;


canvas.height =
window.innerHeight;


}



resize();



window.addEventListener(
"resize",
resize
);





for(
let i=0;
i<160;
i++
){


stars.push({


x:
Math.random()*innerWidth,


y:
Math.random()*innerHeight,


r:
Math.random()*2+0.5,


speed:
Math.random()*0.5+0.1



});


}







function animateStars(){


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);



stars.forEach(s=>{


s.y+=s.speed;



if(
s.y>canvas.height
)

s.y=0;



ctx.beginPath();



ctx.arc(
s.x,
s.y,
s.r,
0,
Math.PI*2
);



ctx.fillStyle=
"rgba(100,210,255,.8)";


ctx.fill();



});



requestAnimationFrame(
animateStars
);


}



animateStars();








/* ==================================
   AGENT DATA
================================== */



const agents=[


{

url:

"https://udify.app/chatbot/zPNLhszEZfxDXrHD",

tip:

"🔍 错题诊疗师：识别错因，建立个人错题知识画像。"

},



{


url:

"https://udify.app/chatbot/MLPSYJvA2xRcuQxv",


tip:

"⚔️ 错题教官：通过找茬训练和陷阱题强化能力。"


},




{


url:

"https://udify.app/chatbot/qVngF5df6eA6DKuP",


tip:

"📊 学情分析师：生成学习画像和薄弱点分析。"


},




{


url:

"https://udify.app/chatbot/xD2yYF586oTgpGYc",


tip:

"🏆 竞赛数据分析师：Excel数据分析与可视化生成。"


}



];








const iframe =
document.getElementById(
"agentFrame"
);






const cards =
document.querySelectorAll(
".enter-agent"
);






cards.forEach(btn=>{


btn.onclick=function(){



let id =
this.dataset.agent;



iframe.src =
agents[id].url;



};




});









/* ==================================
   TRACK SWITCH
================================== */


const btnCourse =
document.getElementById(
"btnCourse"
);



const btnComp =
document.getElementById(
"btnComp"
);





btnCourse.onclick=function(){


btnCourse.classList.add(
"active"
);


btnComp.classList.remove(
"active"
);



iframe.src =
agents[0].url;



};







btnComp.onclick=function(){


btnComp.classList.add(
"active"
);


btnCourse.classList.remove(
"active"
);



iframe.src =
agents[3].url;



};








/* ==================================
   CONNECT EFFECT
================================== */


document
.querySelectorAll(".card")
.forEach(card=>{


card.addEventListener(
"mouseenter",
()=>{


card.style.transform=
"translateY(-8px)";



card.style.boxShadow=
"0 0 40px rgba(80,200,255,.35)";



}
);



card.addEventListener(
"mouseleave",
()=>{


card.style.transform="";

card.style.boxShadow="";


}
);



});




</script>
