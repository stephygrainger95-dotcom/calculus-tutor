<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>微积分错题诊疗师</title>
<style>
  body { margin: 0; font-family: "Microsoft YaHei", sans-serif; background: #f5f7fa; }
  .header { background: #2c5f8a; color: #fff; padding: 24px; text-align: center; }
  .header h1 { margin: 0 0 8px; font-size: 26px; }
  .header p { margin: 0; font-size: 14px; opacity: .85; }
  .container { max-width: 900px; margin: 24px auto; padding: 0 16px; }
  .tip { background: #fff; border-radius: 8px; padding: 14px 18px; margin-bottom: 16px;
         font-size: 14px; color: #555; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .chatbox { background: #fff; border-radius: 8px; overflow: hidden;
             box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .chatbox iframe { width: 100%; height: 640px; border: none; }
</style>
</head>
<body>
  <div class="header">
    <h1>微积分错题诊疗师</h1>
    <p>拍照上传错题 · 智能诊断错因 · 自动记录错题本 · 生成变式训练</p>
  </div>
  <div class="container">
    <div class="tip">
      使用说明：点击下方聊天框，直接输入题目文字，或点击附件按钮上传错题照片。
      诊断完成后发送"确认存入错题本"，系统会自动记录到你的专属错题本。
    </div>
    <div class="chatbox">
     <iframe
 src="https://udify.app/chatbot/zPNLhszEZfxDXrHD"
 style="width: 100%; height: 100%; min-height: 700px"
 frameborder="0"
 allow="microphone;clipboard-write">
</iframe>
    </div>
  </div>
</body>
</html>
